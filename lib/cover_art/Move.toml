[package]
name = "cover_art"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# The evolvable `CoverArt` value type: a still image plus an optional animation,
# each a reference to external (Walrus) storage via `ori::WalrusData`. A
# primitive — it attaches to nothing and touches only `ori`, so a new cover
# format is a republish of this small package, not of the frozen protocol core.
# Composed by the `release_cover_art` extension.
[dependencies]
ori = { git = "https://github.com/unconfirmedlabs/ori.git", subdir = "move", rev = "84d5da270e5860b144961dd4665690238b49560c" }
