[package]
name = "recording_master"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# Media-agnostic: this extension never references audio or any concrete master
# type — trust in *what* is attached is carried by the ingester witness, not by a
# dependency. It does depend on miso core to operate on `Recording` directly
# (cap-gated `uid_mut`), since a `&mut UID` cannot be threaded through a PTB.
[dependencies]
miso = { local = "../../miso-protocol/move" }
