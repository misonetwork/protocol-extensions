[package]
name = "recording_master_reference"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# A deliberate holdover: a bare Walrus reference to a recording's master, with no
# attestation and no technical claims about the audio. Depends only on miso core
# (to reach `Recording` through its cap-gated `uid_mut`) and `ori` for the
# reference type — pinned to the same rev as `recording_preview`.
[dependencies]
miso = { local = "../../miso-protocol/move" }
ori = { git = "https://github.com/unconfirmedlabs/ori.git", subdir = "move", rev = "84d5da270e5860b144961dd4665690238b49560c" }
