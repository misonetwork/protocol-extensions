[package]
name = "recording_preview"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# V1 is a bare Walrus blob reference attached to the recording — no ingestion
# or attestation of the preview audio, so no audio/ingester dependencies. It
# depends on miso core to operate on `Recording` directly (cap-gated
# `uid_mut`) and on `ori` for the `WalrusData` reference type.
[dependencies]
miso = { local = "../../miso-protocol/move" }
ori = { git = "https://github.com/unconfirmedlabs/ori.git", subdir = "move", rev = "84d5da270e5860b144961dd4665690238b49560c" }
