[package]
name = "recording_seal_acl"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# Seal decryption policy for a recording's encrypted masters. Deliberately its
# own tiny package (not part of recording_master, which stays
# encryption-agnostic): Seal binds every sealed DEK to the policy package's
# original ID forever at encryption time, so the policy package must be small,
# stable, and upgradeable. Grant mechanics live in the meigi primitive; this
# package only reaches the Recording and defines the seal_approve entry points.
[dependencies]
miso = { local = "../../miso-protocol/move" }
meigi = { local = "../../../unconfirmedlabs/meigi" }
suins = { r.mvr = "@suins/core", override = true }
