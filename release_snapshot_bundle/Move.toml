[package]
name = "release_snapshot_bundle"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# The write-once pointer from a release to its snapshot-bundle quilt. Depends
# only on miso core (to reach `Release` through its cap-gated `uid_mut`) and
# `ori` for the `WalrusData` reference type — pinned to the same rev as
# `recording_preview` and `recording_master_reference`.
[dependencies]
miso = { local = "../../miso-protocol" }
ori = { git = "https://github.com/unconfirmedlabs/ori.git", subdir = "move", rev = "8a4dbb5f853b78eb7475063a840c4444421c5bbd" }
